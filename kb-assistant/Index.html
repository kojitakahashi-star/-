<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f7f4;
    --panel: #ffffff;
    --text: #1f2a1f;
    --muted: #66705f;
    --line: #dfe3da;
    --accent: #2f6b3a;
    --accent-soft: #e6f0e4;
    --warn: #8a5a00;
    --warn-soft: #fff4dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a14;
      --panel: #1c241c;
      --text: #e4ebe0;
      --muted: #9aa696;
      --line: #2f3a2e;
      --accent: #7fc28a;
      --accent-soft: #233423;
      --warn: #f0c060;
      --warn-soft: #3a3020;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    font-size: 15px;
    line-height: 1.7;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 16px 16px 140px; }
  header { padding: 8px 0 16px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  header h1 { font-size: 20px; margin: 0; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .msg { margin: 16px 0; }
  .msg.user .bubble { background: var(--accent-soft); margin-left: 15%; }
  .bubble {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 16px;
    overflow-wrap: anywhere;
  }
  .bubble h2, .bubble h3, .bubble h4 { font-size: 15px; margin: 12px 0 4px; }
  .bubble ul, .bubble ol { margin: 4px 0; padding-left: 22px; }
  .bubble p { margin: 6px 0; }
  .sources { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 13px; }
  .sources a { color: var(--accent); }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; margin-left: 4px;
         background: var(--warn-soft); color: var(--warn); }
  .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button { font-size: 13px; padding: 4px 10px; }
  .hint { color: var(--muted); font-size: 13px; }
  .examples button { margin: 4px 4px 0 0; font-size: 13px; padding: 4px 10px; }
  form {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--bg); border-top: 1px solid var(--line);
    padding: 12px 16px;
  }
  form .inner { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; height: 64px; padding: 8px 10px;
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
  }
  button {
    font: inherit; cursor: pointer; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); padding: 0 18px; }
  button:disabled { opacity: .5; cursor: default; }
  .error { color: #c0392b; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>森林認証ナレッジ AIアシスタント</h1>
    <p id="status">ナレッジベースを確認しています…</p>
  </header>

  <div id="log">
    <div class="msg">
      <div class="bubble">
        <p>社内のナレッジベース（ナレッジ記事・指摘事例・テンプレート集）をもとに回答します。根拠にした記事へのリンクも表示します。</p>
        <p class="hint">回答で解決しないときは「質問箱に送る」を押すと、ベテランに質問が届きます。顧客名は入力しないでください。</p>
        <div class="examples">
          <button type="button">CoCの初回審査までの流れを教えて</button>
          <button type="button">審査中に書類の不備が見つかったらどうする？</button>
          <button type="button">サマリー（年間取扱量の集計）とは？</button>
        </div>
      </div>
    </div>
  </div>
</div>

<form id="form">
  <div class="inner">
    <textarea id="q" placeholder="質問を入力（Enterで送信、Shift+Enterで改行）"></textarea>
    <button class="primary" id="send" type="submit">送信</button>
  </div>
</form>

<script>
  const chatHistory = [];
  const log = document.getElementById('log');
  const q = document.getElementById('q');
  const send = document.getElementById('send');

  google.script.run.withSuccessHandler(function (s) {
    const el = document.getElementById('status');
    if (!s.syncedAt) { el.textContent = 'ナレッジがまだ取り込まれていません。'; return; }
    el.textContent = '登録件数 ' + s.count + '件 ・ 最終更新 ' + new Date(s.syncedAt).toLocaleString('ja-JP');
  }).getStatus();

  document.querySelectorAll('.examples button').forEach(function (b) {
    b.addEventListener('click', function () { q.value = b.textContent; submit(); });
  });

  q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
  });
  document.getElementById('form').addEventListener('submit', function (e) { e.preventDefault(); submit(); });

  function submit() {
    const question = q.value.trim();
    if (!question || send.disabled) return;
    q.value = '';
    addMessage('user', escapeHtml(question).replace(/\n/g, '<br>'));
    const pending = addMessage('assistant', '<span class="hint">ナレッジを確認して回答を作成しています…</span>');
    setBusy(true);

    google.script.run
      .withSuccessHandler(function (res) {
        pending.innerHTML = renderMarkdown(res.answer) + renderSources(res.sources);
        addActions(pending, question, res.answer);
        chatHistory.push({ role: 'user', text: question }, { role: 'assistant', text: res.answer });
        setBusy(false);
      })
      .withFailureHandler(function (err) {
        pending.innerHTML = '<span class="error">' + escapeHtml(err.message || String(err)) + '</span>';
        setBusy(false);
      })
      .ask(question, chatHistory.slice(-12));
  }

  function addActions(bubble, question, answer) {
    const box = document.createElement('div');
    box.className = 'actions';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = '解決しなかった → 質問箱に送る';
    btn.addEventListener('click', function () {
      const note = prompt('ベテランへの補足があれば入力してください（任意・顧客名は書かない）', '') ;
      if (note === null) return;
      btn.disabled = true;
      btn.textContent = '送信中…';
      google.script.run
        .withSuccessHandler(function () { btn.textContent = '質問箱に送りました'; })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.textContent = '送信に失敗しました（再試行）';
          console.error(err);
        })
        .reportUnresolved(question, answer, note);
    });
    box.appendChild(btn);
    bubble.appendChild(box);
  }

  function addMessage(role, html) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = html;
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    wrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return bubble;
  }

  function setBusy(b) { send.disabled = b; q.disabled = b; if (!b) q.focus(); }

  function renderSources(sources) {
    if (!sources || !sources.length) return '';
    return '<div class="sources"><strong>出典</strong><br>' + sources.map(function (s) {
      const unreviewed = s.status && s.status !== 'レビュー済' && s.status !== '最新'
        ? '<span class="tag">' + escapeHtml(s.status) + '</span>' : '';
      return '[' + s.index + '] ' + escapeHtml(s.type) + '：<a href="' + escapeAttr(s.url) +
        '" target="_blank" rel="noopener">' + escapeHtml(s.title) + '</a>' + unreviewed;
    }).join('<br>') + '</div>';
  }

  // 回答で使う最小限のMarkdown（見出し・箇条書き・太字・リンク）だけを変換する
  function renderMarkdown(md) {
    const lines = escapeHtml(md || '').split('\n');
    let html = '';
    let list = null;
    lines.forEach(function (line) {
      let m;
      if ((m = line.match(/^\s*[-*]\s+(.*)$/))) {
        if (list !== 'ul') { html += closeList(list) + '<ul>'; list = 'ul'; }
        html += '<li>' + inline(m[1]) + '</li>';
        return;
      }
      if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
        if (list !== 'ol') { html += closeList(list) + '<ol>'; list = 'ol'; }
        html += '<li>' + inline(m[1]) + '</li>';
        return;
      }
      html += closeList(list); list = null;
      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
        html += '<h3>' + inline(m[2]) + '</h3>';
      } else if (line.trim()) {
        html += '<p>' + inline(line) + '</p>';
      }
    });
    return html + closeList(list);
  }
  function closeList(list) { return list ? '</' + list + '>' : ''; }
  function inline(s) {
    return s
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function escapeAttr(s) { return /^https?:\/\//.test(s) ? escapeHtml(s) : '#'; }
</script>
</body>
</html>
